    <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.body.innerHTML += '<div style="background:red;color:white;position:fixed;top:0;left:0;z-index:99999;width:100%;padding:20px;text-align:left;overflow:auto;"><h3 style="color:white;margin-top:0;">Global Error</h3><pre>' + msg + '\\n' + url + ':' + lineNo + '\\n' + (error ? error.stack : '') + '</pre></div>';
        return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="background:red;color:white;position:fixed;top:0;left:0;z-index:99999;width:100%;padding:20px;text-align:left;overflow:auto;"><h3 style="color:white;margin-top:0;">Unhandled Promise Rejection</h3><pre>' + event.reason + '</pre></div>';
    });
    </script>
